<script>
  /* pre-paint theme: set before first render to avoid a flash.
     Shares the refract-theme-v2 key with the main site. */
  (function(){
    try{
      var KEY='refract-theme-v2';
      var saved=localStorage.getItem(KEY);
      var osDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
      var mode=saved||(osDark?'dark':'light');
      if(mode==='dark') document.documentElement.setAttribute('data-theme','dark');
      var mc=document.querySelector('meta[name="theme-color"]');
      if(mc) mc.setAttribute('content', mode==='dark' ? '#0a0a0d' : '#f7f7f9');
    }catch(e){}
  })();
</script>
<link rel="icon" href="logo/refract-iris-64.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f7f7f9; --band:#eef0f3; --card:#ffffff;
    --ink:#13141a;
    --ink-2:rgba(19,20,26,.62);
    --ink-3:rgba(19,20,26,.44);
    --ink-4:rgba(19,20,26,.32);
    --border:rgba(19,20,26,.085);
    --border-2:rgba(19,20,26,.16);
    --p:#5754e0; --p-hover:#4441c4;
    --p-tint:rgba(87,84,224,.08);
    --p-tint-2:rgba(87,84,224,.16);
    --code-bg:#eef0f3;
    --font-sans:'Inter',ui-sans-serif,system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --nav-h:66px;
    --side-w:280px;
    --toc-w:240px;
  }
  html[data-theme="dark"]{
    --bg:#0a0a0d; --band:#111218; --card:#15161d;
    --ink:#f4f4f6;
    --ink-2:rgba(244,244,246,.64);
    --ink-3:rgba(244,244,246,.46);
    --ink-4:rgba(244,244,246,.32);
    --border:rgba(244,244,246,.09);
    --border-2:rgba(244,244,246,.17);
    --p:#8284f0; --p-hover:#9b9cf5;
    --p-tint:rgba(130,132,240,.16);
    --p-tint-2:rgba(130,132,240,.28);
    --code-bg:#1a1b22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background:var(--bg);}
  body{
    font-family:var(--font-sans);background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.6;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--p-tint-2);}

  *{scrollbar-width:thin;scrollbar-color:var(--border-2) transparent;}
  *::-webkit-scrollbar{width:9px;height:9px;}
  *::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:9px;border:2px solid var(--bg);}
  *::-webkit-scrollbar-track{background:transparent;}

  /* ════ TOP NAV ════ */
  header.nav{
    position:sticky;top:0;z-index:50;height:var(--nav-h);
    background:rgba(247,247,249,.82);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  html[data-theme="dark"] header.nav{ background:rgba(10,10,13,.82); }
  .nav-in{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .mark{width:28px;height:28px;flex:none;}
  .brand .mark img{width:100%;height:100%;object-fit:contain;}
  .brand .name{font-weight:800;font-size:18px;letter-spacing:.02em;color:var(--ink);}
  .nav-links{display:flex;align-items:center;gap:30px;}
  .nav-links a{font-size:14.5px;font-weight:500;color:var(--ink-2);transition:color .15s;}
  .nav-links a:hover{color:var(--ink);}
  .nav-links a.active{color:var(--ink);font-weight:600;}
  .nav-cta{display:flex;align-items:center;gap:12px;}
  .icon-btn{
    width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:11px;
    background:var(--card);border:1px solid var(--border-2);color:var(--ink);cursor:pointer;transition:.15s;
  }
  .icon-btn:hover{border-color:var(--p);color:var(--p);}
  .icon-btn svg{width:18px;height:18px;}
  html[data-theme="dark"] .icon-btn .i-moon{display:none;}
  html:not([data-theme="dark"]) .icon-btn .i-sun{display:none;}
  .btn{
    display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:15px;
    padding:11px 20px;border-radius:11px;border:1px solid transparent;cursor:pointer;transition:.15s;
  }
  .btn-primary{background:var(--p);color:#fff;}
  .btn-primary:hover{background:var(--p-hover);}
  @media (max-width:1080px){ .nav-links{display:none;} }
  @media (max-width:680px){ .nav-cta .icon-btn:not(.sb-toggle){display:none;} }

  /* ════ DOCS SHELL ════ */
  .shell{
    display:grid;
    grid-template-columns:var(--side-w) minmax(0,1fr) var(--toc-w);
    max-width:1500px;margin:0 auto;align-items:start;
  }

  /* ── sidebar ── */
  .sidebar{
    position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));
    overflow-y:auto;border-right:1px solid var(--border);padding:26px 18px 60px 24px;
  }
  .search{
    display:flex;align-items:center;gap:9px;width:100%;
    background:var(--card);border:1px solid var(--border-2);border-radius:11px;
    padding:9px 11px;color:var(--ink-3);cursor:text;transition:.15s;margin-bottom:24px;
  }
  .search:focus-within{border-color:var(--p);color:var(--ink-2);}
  .search svg{width:16px;height:16px;flex:none;}
  .search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-family:var(--font-sans);font-size:14px;color:var(--ink);}
  .search input::placeholder{color:var(--ink-3);}
  .search .kbd{display:flex;gap:3px;flex:none;}
  .search .kbd b{
    font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink-3);
    background:var(--bg);border:1px solid var(--border-2);border-radius:5px;padding:2px 6px;line-height:1;
  }
  .search-empty{display:none;color:var(--ink-3);font-size:13px;padding:4px 8px 10px;}

  .group{margin-bottom:6px;}
  .group>summary{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    list-style:none;cursor:pointer;user-select:none;
    font-size:13.5px;font-weight:700;letter-spacing:.01em;color:var(--ink);
    padding:8px 8px;border-radius:8px;transition:.12s;
  }
  .group>summary::-webkit-details-marker{display:none;}
  .group>summary:hover{background:var(--p-tint);}
  .group>summary .chev{width:15px;height:15px;color:var(--ink-3);transition:transform .2s ease;flex:none;}
  .group[open]>summary .chev{transform:rotate(180deg);}
  .group ul{list-style:none;margin:2px 0 10px;padding:0;}
  .group li a{
    display:block;font-size:13.5px;color:var(--ink-3);
    padding:6px 10px 6px 18px;margin-left:6px;border-left:1px solid var(--border);
    transition:.12s;border-radius:0 7px 7px 0;
  }
  .group li a:hover{color:var(--ink);border-left-color:var(--border-2);background:rgba(255,255,255,.02);}
  .group li a.current{color:var(--p);font-weight:600;border-left-color:var(--p);background:var(--p-tint);}
  .sb-hide{display:none !important;}

  /* ── main content ── */
  .content{min-width:0;padding:44px 56px 120px;}
  @keyframes docIn{from{transform:translateY(8px);}to{transform:none;}}
  .content.in{animation:docIn .24s ease;}
  @media (prefers-reduced-motion:reduce){ .content.in{animation:none;} }
  .breadcrumb{font-size:13px;color:var(--ink-3);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .breadcrumb .sep{color:var(--ink-4);}
  .content h1{margin:0 0 8px;font-size:clamp(34px,4vw,44px);font-weight:800;letter-spacing:-.025em;line-height:1.08;}
  .lede{font-size:17px;color:var(--ink-2);margin:0 0 10px;max-width:62ch;line-height:1.65;}
  .content h2{
    margin:52px 0 0;padding-top:26px;border-top:1px solid var(--border);position:relative;
    font-size:27px;font-weight:800;letter-spacing:-.02em;scroll-margin-top:calc(var(--nav-h) + 20px);
  }
  .content h3{
    margin:32px 0 0;font-size:19px;font-weight:700;letter-spacing:-.01em;position:relative;
    scroll-margin-top:calc(var(--nav-h) + 20px);
  }
  .h-anchor{opacity:0;margin-left:9px;color:var(--ink-4);font-weight:500;cursor:pointer;transition:.15s;font-size:.8em;}
  .content h2:hover .h-anchor,.content h3:hover .h-anchor{opacity:1;}
  .h-anchor:hover{color:var(--p);}
  .content p{margin:14px 0 0;color:var(--ink-2);font-size:15.5px;max-width:68ch;}
  .content p strong,.content li strong{color:var(--ink);font-weight:600;}
  .content a.link{color:var(--p);font-weight:500;}
  .content a.link:hover{color:var(--p-hover);text-decoration:underline;text-underline-offset:3px;}
  .content ul.body{margin:16px 0 0;padding-left:22px;max-width:68ch;}
  .content ul.body li{margin:9px 0;color:var(--ink-2);font-size:15.5px;}
  .content ul.body li::marker{color:var(--ink-4);}
  code{font-family:var(--mono);font-size:.86em;color:var(--ink);background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:.12em .42em;}

  .codeblock{margin:18px 0 0;background:var(--code-bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;max-width:68ch;}
  .codeblock .cb-bar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid var(--border);}
  .codeblock .cb-bar i{width:10px;height:10px;border-radius:50%;background:var(--border-2);display:block;}
  .codeblock .cb-bar .fn{margin-left:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);}
  .cb-copy{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border-2);color:var(--ink-3);border-radius:7px;padding:3px 9px;font-family:var(--mono);font-size:10.5px;cursor:pointer;transition:.15s;}
  .cb-copy:hover{color:var(--p);border-color:var(--p);}
  .cb-copy svg{width:12px;height:12px;}
  .codeblock pre{margin:0;padding:15px 16px;overflow-x:auto;}
  .codeblock code{background:transparent;border:0;padding:0;font-size:13px;line-height:1.7;color:var(--ink-2);}
  .tok-c{color:var(--ink-4);} .tok-p{color:var(--p-hover);} .tok-s{color:#1e9e63;}

  .callout{margin:22px 0 0;display:flex;gap:13px;max-width:68ch;background:var(--p-tint);border:1px solid var(--p-tint-2);border-radius:12px;padding:15px 17px;}
  .callout svg{width:19px;height:19px;flex:none;color:var(--p);margin-top:1px;}
  .callout p{margin:0;color:var(--ink-2);font-size:14.5px;}
  .callout strong{color:var(--ink);}

  .tbl-wrap{margin:18px 0 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;max-width:68ch;}
  table{border-collapse:collapse;width:100%;font-size:14px;}
  th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--border);}
  th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;font-family:var(--mono);background:var(--card);}
  td{color:var(--ink-2);} tr:last-child td{border-bottom:0;} td code{font-size:12.5px;}

  /* card grid (for next-steps) */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 0;max-width:68ch;}
  .cards a{display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:17px 18px;transition:.15s;}
  .cards a:hover{border-color:var(--p);transform:translateY(-2px);}
  .cards .ct{font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .cards .ct svg{width:16px;height:16px;color:var(--p);}
  .cards .cd{font-size:13.5px;color:var(--ink-3);margin-top:5px;line-height:1.5;}
  @media (max-width:560px){ .cards{grid-template-columns:1fr;} }

  .pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:60px;max-width:68ch;}
  .pager a{border:1px solid var(--border);border-radius:12px;padding:15px 18px;transition:.15s;background:var(--card);}
  .pager a:hover{border-color:var(--p);}
  .pager .dir{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}
  .pager .tt{font-size:15px;font-weight:600;color:var(--ink);margin-top:4px;}
  .pager .next{text-align:right;}
  .pager a.empty{visibility:hidden;}

  /* ── right TOC ── */
  .toc{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));overflow-y:auto;padding:44px 24px 60px 8px;}
  .toc .toc-h{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink);margin-bottom:14px;}
  .toc ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--border);}
  .toc li a{display:block;font-size:13px;color:var(--ink-3);padding:6px 0 6px 16px;margin-left:-1px;border-left:1px solid transparent;transition:.12s;line-height:1.4;}
  .toc li a:hover{color:var(--ink-2);}
  .toc li a.sub{padding-left:28px;font-size:12.5px;}
  .toc li a.active{color:var(--p);border-left-color:var(--p);font-weight:600;}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border-2);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 20px 40px -20px rgba(0,0,0,.35);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .sb-toggle{display:none;}
  @media (max-width:1180px){
    .shell{grid-template-columns:var(--side-w) minmax(0,1fr);}
    .toc{display:none;}
    .content{padding:40px 44px 100px;}
  }
  @media (max-width:880px){
    .shell{grid-template-columns:1fr;}
    .sidebar{
      position:fixed;top:var(--nav-h);left:0;bottom:0;width:300px;z-index:48;
      background:var(--bg);transform:translateX(-105%);transition:transform .25s ease;
      box-shadow:30px 0 60px -30px rgba(0,0,0,.35);
    }
    body.sb-open .sidebar{transform:none;}
    .sb-scrim{position:fixed;inset:var(--nav-h) 0 0;background:rgba(0,0,0,.5);z-index:47;opacity:0;pointer-events:none;transition:.2s;}
    body.sb-open .sb-scrim{opacity:1;pointer-events:auto;}
    .content{padding:30px 24px 90px;}
    .pager{grid-template-columns:1fr;}
    .sb-toggle{display:grid;}
  }
</style>
</head>

<template class="doc" data-slug="documentation" data-group="Start here" data-title="Documentation"
  data-lede="Welcome to Refract — a fast, modern Minecraft launcher. This guide covers installing it, managing instances, and getting mods running.">
  <h2>What is Refract?</h2>
  <p>Refract is an open-source Minecraft launcher built with <strong>Tauri</strong> and React. It browses mods from Modrinth and CurseForge, manages a bundled Java runtime, and keeps your instances, accounts and updates in one place — so you spend time playing, not configuring.</p>
  <div class="callout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <p><strong>New here?</strong> Jump straight to <a class="link" href="#installation">Installation</a>, then <a class="link" href="#installing-mods">Installing mods</a>.</p>
  </div>
  <h2>Highlights</h2>
  <ul class="body">
    <li><strong>One mod search</strong> across Modrinth and CurseForge, with loader and version filters.</li>
    <li><strong>Isolated instances</strong> — keep multiple versions and modpacks side by side without conflicts.</li>
    <li><strong>Managed Java</strong> — the right JDK is downloaded per instance automatically.</li>
    <li><strong>Silent updates</strong> — Refract updates itself in the background.</li>
    <li><strong>Cross-platform</strong> — Windows, macOS and Linux from a single codebase.</li>
  </ul>
  <h2>Where to next</h2>
  <div class="cards">
    <a href="#installation"><div class="ct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>Installation</div><div class="cd">Download and set up Refract on your OS.</div></a>
    <a href="#loaders-overview"><div class="ct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>Mod loaders</div><div class="cd">Fabric, Forge, NeoForge and Quilt explained.</div></a>
    <a href="#installing-mods"><div class="ct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Installing mods</div><div class="cd">Find, install and update mods in a click.</div></a>
    <a href="#troubleshooting"><div class="ct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>Troubleshooting</div><div class="cd">Fixes for the most common issues.</div></a>
  </div>
</template>

<template class="doc" data-slug="installation" data-group="Start here" data-title="Installation"
  data-lede="Get Refract running on your machine in under a minute. It's free, open source, and keeps itself up to date.">
  <h2>Overview</h2>
  <p>Refract bundles a managed Java runtime, fetches mods from Modrinth and CurseForge, and handles instances, accounts and updates for you — there's nothing else to install first.</p>
  <div class="callout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <p><strong>No Java setup required.</strong> Refract downloads the correct JDK per instance automatically.</p>
  </div>
  <h2>Download &amp; install</h2>
  <p>Grab the latest release from the <a class="link" href="index.html#download">download page</a> or directly from <a class="link" href="https://github.com/RefractMC/Refract_MC/releases/latest" target="_blank" rel="noopener">GitHub Releases</a>. Current version is <strong>1.2.0</strong>.</p>
  <h3>Windows</h3>
  <p>Run the <code>Refract_1.2.0_x64-setup.exe</code> installer, or use the <code>.msi</code> for managed deployments. Refract checks for updates on every launch and installs them in-app — no manual reinstalls.</p>
  <h3>macOS</h3>
  <p>Open the <code>.dmg</code> and drag Refract to Applications. Pick the build for your chip:</p>
  <ul class="body">
    <li><code>Refract_1.2.0_aarch64.dmg</code> — Apple Silicon (M1 and newer).</li>
    <li><code>Refract_1.2.0_x64.dmg</code> — Intel Macs.</li>
  </ul>
  <h3>Linux</h3>
  <p>Pick the package for your distribution:</p>
  <ul class="body">
    <li><code>.deb</code> — Debian, Ubuntu and derivatives. Install with <code>sudo dpkg -i Refract_1.2.0_amd64.deb</code>.</li>
    <li><code>.rpm</code> — Fedora, RHEL and derivatives. Install with <code>sudo rpm -i Refract-1.2.0-1.x86_64.rpm</code>.</li>
    <li><code>.AppImage</code> — Any distribution. Mark it executable and run it directly:</li>
  </ul>
  <div class="codeblock">
    <div class="cb-bar"><i></i><i></i><i></i><span class="fn">terminal</span></div>
    <pre><code><span class="tok-p">chmod</span> +x Refract_1.2.0_amd64.AppImage
<span class="tok-p">./</span>Refract_1.2.0_amd64.AppImage</code></pre>
  </div>
  <h2>Requirements</h2>
  <ul class="body">
    <li><strong>OS</strong> — Windows 10/11, macOS 11+, or a modern 64-bit Linux desktop.</li>
    <li><strong>RAM</strong> — 4 GB minimum, 8 GB+ recommended for modpacks.</li>
    <li><strong>Disk</strong> — ~300 MB for Refract plus space for instances and mods.</li>
    <li><strong>Network</strong> — needed for first-run downloads, mod browsing and account login.</li>
  </ul>
</template>

<template class="doc" data-slug="loaders-overview" data-group="Mod loaders" data-title="Overview"
  data-lede="A mod loader patches Minecraft so it can run mods. Refract installs and manages loaders for you — here's how they compare.">
  <h2>How Refract handles loaders</h2>
  <p>When you create an instance you choose a loader and version. Refract downloads the loader, sets up the profile, and from then on every mod you add is checked against that loader so incompatible files are flagged before launch.</p>
  <h2>Comparison</h2>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>Loader</th><th>Best for</th><th>Notes</th></tr></thead>
      <tbody>
        <tr><td>Fabric</td><td>Lightweight setups</td><td>Fast updates, huge mod selection</td></tr>
        <tr><td>Forge</td><td>Large modpacks</td><td>Mature, the most content overall</td></tr>
        <tr><td>NeoForge</td><td>Modern Forge</td><td>Forge fork, active development</td></tr>
        <tr><td>Quilt</td><td>Fabric power users</td><td>Fabric-compatible with extra hooks</td></tr>
      </tbody>
    </table>
  </div>
  <div class="callout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <p>Mods are <strong>not interchangeable</strong> between loaders. A Fabric mod won't load on Forge — check the project's supported loaders before installing.</p>
  </div>
</template>

<template class="doc" data-slug="fabric" data-group="Mod loaders" data-title="Fabric"
  data-lede="A lightweight, fast-moving loader with first-class support across Modrinth.">
  <h2>About Fabric</h2>
  <p>Fabric is minimal and updates to new Minecraft snapshots quickly, which makes it the go-to for performance mods and early version support. Most Fabric setups also need <strong>Fabric API</strong>, a shared library many mods depend on.</p>
  <h2>Using it in Refract</h2>
  <ul class="body">
    <li>Create an instance and pick <strong>Fabric</strong> as the loader.</li>
    <li>Refract offers to add <strong>Fabric API</strong> automatically — accept it unless you know you don't need it.</li>
    <li>Browse mods filtered to Fabric and your game version, then install.</li>
  </ul>
</template>

<template class="doc" data-slug="forge" data-group="Mod loaders" data-title="Forge"
  data-lede="The long-standing loader behind most big modpacks and content mods.">
  <h2>About Forge</h2>
  <p>Forge has the largest catalogue of mods and is the foundation for most major modpacks. It's heavier than Fabric and updates more slowly, but for content-rich playthroughs it's usually the right choice.</p>
  <h2>Using it in Refract</h2>
  <ul class="body">
    <li>Pick <strong>Forge</strong> when creating the instance; Refract installs the matching Forge build.</li>
    <li>Forge mods don't need a separate API library.</li>
    <li>For very large packs, raise the memory allocation under <a class="link" href="#launching">launch options</a>.</li>
  </ul>
</template>

<template class="doc" data-slug="neoforge" data-group="Mod loaders" data-title="NeoForge"
  data-lede="A community-driven fork of Forge with faster, more open development.">
  <h2>About NeoForge</h2>
  <p>NeoForge began as a fork of Forge and has become the default for many newer mods. It keeps broad compatibility with the Forge ecosystem while iterating more quickly.</p>
  <h2>Using it in Refract</h2>
  <ul class="body">
    <li>Select <strong>NeoForge</strong> as the loader for supported game versions.</li>
    <li>Check each mod's listing — some target Forge, some NeoForge, some both.</li>
  </ul>
</template>

<template class="doc" data-slug="quilt" data-group="Mod loaders" data-title="Quilt"
  data-lede="A Fabric-compatible loader with additional features for advanced setups.">
  <h2>About Quilt</h2>
  <p>Quilt is built on Fabric's foundations and can run most Fabric mods, while adding its own hooks and the <strong>Quilt Standard Libraries</strong>. It's aimed at people who want Fabric's speed with a few extra capabilities.</p>
  <h2>Using it in Refract</h2>
  <ul class="body">
    <li>Choose <strong>Quilt</strong> when creating the instance.</li>
    <li>Fabric mods generally work; Refract still flags anything that declares incompatibility.</li>
  </ul>
</template>

<template class="doc" data-slug="concepts-overview" data-group="Concepts" data-title="Overview"
  data-lede="The handful of ideas that make the rest of Refract click into place.">
  <h2>The model</h2>
  <p>Refract is organised around a few simple objects. Understand these and everything else follows:</p>
  <ul class="body">
    <li><strong>Instance</strong> — a self-contained game install: one version, one loader, its own mods and saves.</li>
    <li><strong>Content</strong> — mods, resource packs, shaders and modpacks you add to an instance.</li>
    <li><strong>Account</strong> — your Microsoft/Minecraft login, used to launch and to show your skin.</li>
    <li><strong>Runtime</strong> — the Java version Refract manages per instance.</li>
  </ul>
  <div class="callout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <p>Because instances are isolated, you can break one experimenting and the rest are untouched.</p>
  </div>
</template>

<template class="doc" data-slug="instances" data-group="Concepts" data-title="Instances and profiles"
  data-lede="Each instance is an isolated game install with its own version, loader, mods and saves.">
  <h2>Why isolation matters</h2>
  <p>Keeping each setup separate means a mod conflict, a corrupted world or a risky update only affects that one instance. You can run vanilla 1.20, a heavy Forge pack and a Fabric performance build all at once.</p>
  <h2>What an instance holds</h2>
  <ul class="body">
    <li>Minecraft version and loader.</li>
    <li>Its own <code>mods</code>, <code>config</code>, <code>resourcepacks</code> and <code>saves</code> folders.</li>
    <li>Per-instance Java and memory settings.</li>
  </ul>
  <p>Duplicate an instance before a big change to keep a known-good copy.</p>
</template>

<template class="doc" data-slug="content" data-group="Concepts" data-title="Mods and content"
  data-lede="Mods, resource packs, shaders and modpacks all install the same way.">
  <h2>Content types</h2>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>Type</th><th>Goes to</th></tr></thead>
      <tbody>
        <tr><td>Mods</td><td><code>mods/</code></td></tr>
        <tr><td>Resource packs</td><td><code>resourcepacks/</code></td></tr>
        <tr><td>Shader packs</td><td><code>shaderpacks/</code></td></tr>
        <tr><td>Modpacks</td><td>A whole new instance</td></tr>
      </tbody>
    </table>
  </div>
  <h2>Sources</h2>
  <p>Refract searches <strong>Modrinth</strong> and <strong>CurseForge</strong> together. You can also drop in a local <code>.jar</code> for anything that isn't on either platform.</p>
</template>

<template class="doc" data-slug="accounts" data-group="Concepts" data-title="Accounts"
  data-lede="Sign in with Microsoft to launch the game and load your skin.">
  <h2>Adding an account</h2>
  <p>Open <strong>Accounts</strong> and sign in through the Microsoft login. Refract stores the session token securely and refreshes it automatically — you won't normally need to log in again.</p>
  <h2>Multiple accounts</h2>
  <ul class="body">
    <li>Add several accounts and switch the active one with a click.</li>
    <li>Your skin and username display per account.</li>
  </ul>
  <div class="callout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <p>A valid Minecraft: Java Edition license is required to launch the game.</p>
  </div>
</template>

<template class="doc" data-slug="java" data-group="Concepts" data-title="Java runtime"
  data-lede="Refract picks and downloads the right Java version for each instance.">
  <h2>Automatic runtimes</h2>
  <p>Different Minecraft versions need different Java versions. Refract detects the requirement and downloads a matching JDK, storing runtimes so they're shared across instances that need the same one.</p>
  <h2>Using your own Java</h2>
  <p>Advanced users can point an instance at a custom Java path under <strong>Settings → Java &amp; launch</strong>. Leave it on automatic unless you have a specific reason to override it.</p>
</template>

<template class="doc" data-slug="installing-mods" data-group="Using Refract" data-title="Installing mods"
  data-lede="Find a mod, hit install, play — Refract resolves versions and dependencies for you.">
  <h2>From the browser</h2>
  <ul class="body">
    <li>Open <strong>Browse mods</strong> and search across Modrinth and CurseForge.</li>
    <li>Filter by loader and game version so you only see compatible projects.</li>
    <li>Click <strong>Install</strong>; Refract adds the mod and any required dependencies.</li>
  </ul>
  <h2>Local files</h2>
  <p>Drag a <code>.jar</code> straight onto an instance to add a mod that isn't on either platform. Refract still checks its declared loader and version.</p>
  <h2>Updating</h2>
  <p>Refract shows when newer versions are available and updates them in place — no re-downloading by hand.</p>
</template>

<template class="doc" data-slug="organizing" data-group="Using Refract" data-title="Organizing instances"
  data-lede="Group, rename, pin and duplicate instances to keep a tidy library.">
  <h2>Keeping order</h2>
  <ul class="body">
    <li><strong>Pin</strong> the instances you play most so they sit at the top.</li>
    <li><strong>Rename</strong> and set an icon to tell similar setups apart.</li>
    <li><strong>Duplicate</strong> before major changes for an instant backup.</li>
  </ul>
  <h2>Recents and playtime</h2>
  <p>The Library home surfaces recently played instances and tracks playtime, so picking up where you left off is one click.</p>
</template>

<template class="doc" data-slug="launching" data-group="Using Refract" data-title="Launching the game"
  data-lede="Launch options control memory, JVM arguments and the game window.">
  <h2>Launch options</h2>
  <p>Per-instance options live under <strong>Settings → Java &amp; launch</strong>:</p>
  <ul class="body">
    <li><strong>Memory</strong> — allocate RAM with a slider; sane <code>-Xmx</code>/<code>-Xms</code> defaults are set for you.</li>
    <li><strong>JVM arguments</strong> — append custom flags for tuning.</li>
    <li><strong>Resolution</strong> — set a fixed window size or launch fullscreen.</li>
  </ul>
  <h2>First launch</h2>
  <p>The first time you start an instance, Refract downloads the version files and Java runtime. Subsequent launches are near-instant.</p>
</template>

<template class="doc" data-slug="settings" data-group="Reference" data-title="Settings"
  data-lede="A tour of Refract's settings, from appearance to accounts.">
  <h2>Appearance</h2>
  <p>Switch between light and dark themes, set an accent colour, and apply a custom background image to make the launcher yours.</p>
  <h2>Java &amp; launch</h2>
  <p>Global defaults for memory, JVM arguments and Java path. Instances inherit these unless overridden individually.</p>
  <h2>Updates</h2>
  <p>Refract updates silently by default. You can check the current version and release notes here at any time.</p>
</template>

<template class="doc" data-slug="troubleshooting" data-group="Reference" data-title="Troubleshooting"
  data-lede="Quick fixes for the issues people hit most often.">
  <h2>The game won't launch</h2>
  <ul class="body">
    <li>Confirm an account is signed in and the session is valid.</li>
    <li>Let the first launch finish downloading version files and Java.</li>
    <li>Check for a mod flagged as incompatible with the instance's loader or version.</li>
  </ul>
  <h2>A mod is greyed out</h2>
  <p>That mod's metadata doesn't match the instance. Install a build for the correct loader and game version.</p>

<script>
(function(){
  // theme toggle (shared key with the main site)
  (function(){
    var root = document.documentElement;
    var KEY = 'refract-theme-v2';
    function setTheme(mode){
      if (mode === 'dark') root.setAttribute('data-theme','dark');
      else root.removeAttribute('data-theme');
      try { localStorage.setItem(KEY, mode); } catch(e){}
    }
    var saved = 'light';
    try { saved = localStorage.getItem(KEY) || ((window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light'); } catch(e){}
    setTheme(saved);
    var btn = document.getElementById('themeBtn');
    if (btn) btn.addEventListener('click', function(){
      setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  })();

  var FALLBACK = 'documentation';
  var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

  var tpls = Array.prototype.slice.call(document.querySelectorAll('template.doc'));
  var pages = tpls.map(function(t){
    return {
      slug:t.dataset.slug, group:t.dataset.group, title:t.dataset.title,
      lede:t.dataset.lede||'', html:t.innerHTML, text:(t.content?t.content.textContent:t.textContent)||''
    };
  });
  var order = pages.map(function(p){ return p.slug; });
  function byslug(s){ for(var i=0;i<pages.length;i++) if(pages[i].slug===s) return pages[i]; return null; }
  function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ── build sidebar ── */
  var sideNav = document.getElementById('sideNav');
  var groups = [];
  pages.forEach(function(p){
    var g=null; for(var i=0;i<groups.length;i++) if(groups[i].name===p.group) g=groups[i];
    if(!g){ g={name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  groups.forEach(function(g){
    var d=document.createElement('details'); d.className='group'; d.open=true;
    var sm=document.createElement('summary'); sm.innerHTML=esc(g.name)+CHEV; d.appendChild(sm);
    var ul=document.createElement('ul');
    g.items.forEach(function(p){
      var li=document.createElement('li');
      var a=document.createElement('a'); a.href='#'+p.slug; a.textContent=p.title; a.setAttribute('data-slug',p.slug);
      li.appendChild(a); ul.appendChild(li);
    });
    d.appendChild(ul); sideNav.appendChild(d);
  });

  var article=document.getElementById('article');
  var tocList=document.getElementById('tocList');
  var toc=document.getElementById('toc');
  var breadcrumbHtml='';
  var spy=null;
  var currentSlug=null;

  function parseHash(){
    var h=decodeURIComponent((location.hash||'').replace(/^#/,''));
    if(!h) return {slug:FALLBACK, head:null};
    var parts=h.split('/');
    return {slug:parts[0], head:parts[1]||null};
  }

  function buildToc(heads){
    if(!heads.length){ toc.style.visibility='hidden'; tocList.innerHTML=''; return; }
    toc.style.visibility='';
    var html='';
    heads.forEach(function(h){
      html+='<li><a class="'+(h.tagName==='H3'?'sub':'')+'" href="#'+currentSlug+'/'+h.id+'">'+esc(h.textContent.replace(/#$/,'').trim())+'</a></li>';
    });
    tocList.innerHTML=html;
  }

  function initSpy(heads){
    if(spy) spy.disconnect();
    var links={}; Array.prototype.slice.call(tocList.querySelectorAll('a')).forEach(function(a){
      links[a.getAttribute('href').split('/')[1]]=a;
    });
    spy=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          Object.keys(links).forEach(function(k){ links[k].classList.remove('active'); });
          if(links[en.target.id]) links[en.target.id].classList.add('active');
        }
      });
    }, {rootMargin:'-90px 0px -70% 0px', threshold:0});
    heads.forEach(function(h){ if(h.id) spy.observe(h); });
  }

  function decorate(){
    /* heading anchors */
    Array.prototype.slice.call(article.querySelectorAll('h2,h3')).forEach(function(h){
      var a=document.createElement('a'); a.className='h-anchor'; a.textContent='#';
      a.href='#'+currentSlug+'/'+h.id; a.setAttribute('aria-label','Link to this section');
      a.addEventListener('click', function(e){
        e.preventDefault();
        var url=location.href.split('#')[0]+'#'+currentSlug+'/'+h.id;
        navigator.clipboard && navigator.clipboard.writeText(url);
        history.replaceState(null,'','#'+currentSlug+'/'+h.id);
        scrollToHead(h.id); toast('Link copied');
      });
      h.appendChild(a);
    });
    /* copy buttons on code blocks */
    Array.prototype.slice.call(article.querySelectorAll('.codeblock')).forEach(function(cb){
      var bar=cb.querySelector('.cb-bar'); var pre=cb.querySelector('pre');
      if(!bar||!pre) return;
      var btn=document.createElement('button'); btn.className='cb-copy'; btn.type='button';
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy';
      btn.addEventListener('click', function(){
        navigator.clipboard && navigator.clipboard.writeText(pre.innerText.trim());
        btn.innerHTML='Copied'; toast('Copied to clipboard');
        setTimeout(function(){ btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy'; },1400);
      });
      bar.appendChild(btn);
    });
    /* internal links that point to a page slug */
    Array.prototype.slice.call(article.querySelectorAll('a[href^="#"]')).forEach(function(a){
      if(a.classList.contains('h-anchor')) return;
    });
  }

  function setPager(prev,next){
    var p='', n='';
    if(prev) p='<a href="#'+prev.slug+'"><div class="dir">← Previous</div><div class="tt">'+esc(prev.title)+'</div></a>';
    else p='<a class="empty" aria-hidden="true"></a>';
    if(next) n='<a class="next" href="#'+next.slug+'"><div class="dir">Next →</div><div class="tt">'+esc(next.title)+'</div></a>';
    else n='<a class="empty next" aria-hidden="true"></a>';
    return '<div class="pager">'+p+n+'</div>';
  }

  function scrollToHead(id){
    var t=document.getElementById(id); if(!t) return;
    window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-82, behavior:'smooth'});
  }

  function render(slug, head){
    var p=byslug(slug)||byslug(FALLBACK)||pages[0];
    currentSlug=p.slug;
    document.title=p.title+' — Refract Docs';

    var bc='<div class="breadcrumb"><a class="link" href="#'+FALLBACK+'" style="color:var(--ink-3);font-weight:400">Docs</a><span class="sep">/</span><span>'+esc(p.group)+'</span><span class="sep">/</span><span style="color:var(--ink-2)">'+esc(p.title)+'</span></div>';
    var body=bc+'<h1>'+esc(p.title)+'</h1>'+(p.lede?'<p class="lede">'+p.lede+'</p>':'')+p.html;
    var i=order.indexOf(p.slug);
    body+=setPager(pages[i-1], pages[i+1]);
    article.innerHTML=body;

    var heads=Array.prototype.slice.call(article.querySelectorAll('h2,h3'));
    var seen={};
    heads.forEach(function(h){
      var id=slugify(h.textContent)||'section';
      if(seen[id]) id=id+'-'+(++seen[id]); else seen[id]=1;
      h.id=id;
    });
    decorate();
    buildToc(heads);
    initSpy(heads);

    Array.prototype.slice.call(sideNav.querySelectorAll('a')).forEach(function(a){
      var on=a.getAttribute('data-slug')===p.slug;
      a.classList.toggle('current', on);
      if(on){ var det=a.closest('details'); if(det) det.open=true; }
    });

    /* restart entrance animation */
    article.classList.remove('in'); void article.offsetWidth; article.classList.add('in');
    if(head){ scrollToHead(head); } else { window.scrollTo({top:0}); }
  }

  function route(){
    var r=parseHash();
    if(r.slug===currentSlug){ if(r.head) scrollToHead(r.head); return; }
    document.body.classList.remove('sb-open');
    render(r.slug, r.head);
  }
  window.addEventListener('hashchange', route);

  /* ── search ── */
  var search=document.getElementById('docSearch');
  var emptyEl=document.getElementById('searchEmpty');
  function filter(){
    var q=search.value.trim().toLowerCase();
    var anyGlobal=false;
    Array.prototype.slice.call(sideNav.querySelectorAll('.group')).forEach(function(g){
      var any=false;
      Array.prototype.slice.call(g.querySelectorAll('li')).forEach(function(li){
        var a=li.querySelector('a'); var p=byslug(a.getAttribute('data-slug'));
        var hay=(p.title+' '+p.group+' '+p.text).toLowerCase();
        var hit=!q || hay.indexOf(q)!==-1;
        li.classList.toggle('sb-hide', !hit);
        if(hit){ any=true; anyGlobal=true; }
      });
      g.classList.toggle('sb-hide', !any);
      if(q&&any) g.open=true;
    });
    emptyEl.style.display=(q && !anyGlobal)?'block':'none';
  }
  search.addEventListener('input', filter);
  window.addEventListener('keydown', function(e){
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); document.body.classList.remove('sb-open'); search.focus(); search.select(); }
    if(e.key==='Escape' && document.activeElement===search){ search.value=''; filter(); search.blur(); }
  });

  /* ── toc smooth scroll (no full re-render) ── */
  tocList.addEventListener('click', function(e){
    var a=e.target.closest('a'); if(!a) return;
    e.preventDefault();
    var head=a.getAttribute('href').split('/')[1];
    history.replaceState(null,'','#'+currentSlug+'/'+head);
    scrollToHead(head);
  });

  /* ── mobile sidebar ── */
  var sbToggle=document.getElementById('sbToggle');
  var sbScrim=document.getElementById('sbScrim');
  if(sbToggle) sbToggle.addEventListener('click', function(){ document.body.classList.toggle('sb-open'); });
  if(sbScrim) sbScrim.addEventListener('click', function(){ document.body.classList.remove('sb-open'); });

  /* ── toast ── */
  var toastEl=document.getElementById('toast'); var toastTimer;
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
  }

  /* initial */
  render(parseHash().slug, parseHash().head);
})();
</script>
</body>
</html>
