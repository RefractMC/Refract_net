<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refract — a Minecraft launcher that stays out of your way</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Cabin:wght@500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#7b39fc',darkp:'#2b2344',ink:'#0b0716'},fontFamily:{manrope:['Manrope','sans-serif'],cabin:['Cabin','sans-serif'],serif2:['"Instrument Serif"','serif'],inter:['Inter','sans-serif'],mono:['"JetBrains Mono"','monospace']}}}};</script>
<style>
html{scroll-behavior:smooth;}
body{margin:0;background:#0b0716;}
a{color:#fff;}a:hover{color:rgba(255,255,255,.85);}
.bg-video{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-video video{width:100%;height:100%;object-fit:cover;}
.bg-video .tint{position:absolute;inset:0;background:rgba(11,7,22,0.45);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;
const GH = "https://github.com/RefractMC/Refract_MC";
const REL = GH + "/releases/latest";
const VIDEO = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260210_031346_d87182fb-b0af-4273-84d1-c6fd17d6bf0f.mp4";
function IrisLogo({size=32}){
  return (<svg width={size} height={size} viewBox="-110 -110 220 220" aria-hidden="true">
    <g>{[0,30,60,90,120,150].map((r,i)=>(<polygon key={r} points="0,-92 14,0 0,92 -14,0" fill={["#5316D4","#3D0FA3","#8A52FF"][i%3]} transform={`rotate(${r})`}></polygon>))}</g>
    <circle r="24" fill="#1B044F"></circle><circle r="6" fill="#ECE4FF"></circle>
  </svg>);
}
const glass="bg-[rgba(22,16,39,0.75)] backdrop-blur-md border border-white/10";

/* ── Nav ── */
function Navbar(){
  const [open,setOpen]=useState(false);
  const links=[["Features","#features"],["Compare","#compare"],["Download","#download"],["Changelog","#changelog"],["FAQ","#faq"],["Docs","docs.html"]];
  return (<nav className="relative z-20 w-full flex items-center justify-between px-6 lg:px-[120px] py-[16px]">
    <a href="#top" className="flex items-center gap-2.5 hover:opacity-90">
      <IrisLogo size={34}></IrisLogo>
      <span className="font-manrope font-bold text-white text-[18px] tracking-tight">Refract</span>
    </a>
    <div className="hidden lg:flex items-center gap-7">
      {links.map(([t,h])=>(<a key={t} href={h} className="font-manrope font-medium text-[14px] text-white hover:opacity-80">{t}</a>))}
      <a href={GH} target="_blank" rel="noopener" className="font-manrope font-semibold text-[14px] !text-[#171717] bg-white border border-[#d4d4d4] rounded-[8px] px-4 py-2 hover:bg-neutral-100 ml-2">View Source</a>
    </div>
    <button className="lg:hidden text-white" aria-label="Menu" onClick={()=>setOpen(true)}>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
    {open&&(<div className="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center gap-7">
      <button className="absolute top-5 right-6 text-white" aria-label="Close" onClick={()=>setOpen(false)}>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      {links.map(([t,h])=>(<a key={t} href={h} className="font-manrope font-medium text-[22px] text-white" onClick={()=>setOpen(false)}>{t}</a>))}
    </div>)}
  </nav>);
}

/* ── Hero ── */
function Hero(){
  return (<header id="top" className="relative z-10 w-full">
    <Navbar></Navbar>
    <div className="relative flex flex-col items-center text-center mt-20 lg:mt-24 px-6">
      <a href="#changelog" className="flex items-center gap-2.5 h-[38px] rounded-[10px] px-2 pr-4 bg-[rgba(85,80,110,0.4)] backdrop-blur-md border border-[rgba(164,132,215,0.5)] hover:border-[rgba(164,132,215,0.9)]">
        <span className="font-cabin font-medium text-[12px] text-white bg-primary rounded-[6px] px-2 py-0.5">v1.3.0</span>
        <span className="font-cabin font-medium text-[14px] text-white">View Release Notes →</span>
      </a>
      <h1 className="font-serif2 text-white text-5xl lg:text-[88px] leading-[1.1] mt-6 max-w-[960px]">Refract Launcher</h1>
      <p className="font-inter font-normal text-[18px] text-white/70 max-w-[640px] mt-6">Browse Modrinth, CurseForge and FTB, click install, hit play. Instances, Java versions and accounts are handled for you — no folder digging, no version juggling.</p>
      <div className="flex flex-wrap items-center justify-center gap-5 mt-9">
        <a href="#download" className="flex items-center gap-2 font-cabin font-medium text-[16px] text-white bg-primary rounded-[10px] px-8 py-3.5 hover:bg-[#8a4efd]">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v12"></path><path d="m7 11 5 5 5-5"></path><path d="M5 21h14"></path></svg>Download
        </a>
        <a href="#download" className="font-cabin font-medium text-[16px] text-white/85 hover:text-white">All Downloads →</a>
      </div>
      <div className="font-mono text-[12px] text-white/50 mt-6">free · GPL-3.0 · windows / macos / linux · no account needed to browse</div>
      <div className="relative mt-14 lg:mt-16 w-full max-w-[1100px] rounded-t-2xl overflow-hidden border border-b-0 border-white/15 shadow-[0_-20px_80px_rgba(83,22,212,0.35)]">
        <img src="screenshots/hero-browse.png" alt="Refract launcher screenshot" className="w-full block"></img>
      </div>
    </div>
  </header>);
}

/* ── Why (prose, human voice) ── */
function Why(){
  return (<section className="relative z-10 px-6 lg:px-[120px] pt-24 lg:pt-28 pb-10">
    <div className="max-w-[1200px] mx-auto grid lg:grid-cols-[minmax(0,420px)_1fr] gap-10 lg:gap-20 items-start">
      <h2 className="font-serif2 text-white text-4xl lg:text-[48px] leading-[1.08]">Why another launcher?</h2>
      <div className="font-inter text-[16px] leading-relaxed text-white/70 max-w-[560px] flex flex-col gap-4 pt-2">
        <p>Because we kept alt-tabbing between a launcher, two mod sites and a Java download page just to play with friends. Refract folds all of that into one app: the content browsers are built in, dependencies resolve themselves, and the right Java shows up without you thinking about it.</p>
        <p>It's GPL-3.0, there are no ads and nothing is paywalled. If you're coming from Prism, MultiMC, ATLauncher or the CurseForge app, the Sync panel will find your instances and bring them over — or just link them where they are.</p>
      </div>
    </div>
  </section>);
}

/* ── Features (editorial rows, no cards) ── */
const FEATURES=[
  ["One-click installs","Mods, modpacks, shaders, resource packs and datapacks from Modrinth, CurseForge or FTB land exactly where Minecraft expects them. Required dependencies come along automatically."],
  ["Instances that stay organized","Group them, pin them, search them, export them as .mrpack. Store them on another drive if your SSD is full. Import your old library instead of rebuilding it."],
  ["Updates you can see","Out-of-date mods and packs are marked. Update one, or all of them — modpack updates keep your worlds, options and server list."],
  ["Java, handled","Refract detects installed runtimes (including the ones the vanilla launcher hides) and downloads the right one when a version needs it. Aikar's flags are one click away."],
  ["Your whole setup in one place","Worlds with ZIP backups, screenshots, saved servers with live ping, skins with a 3D preview, playtime stats. All per instance, all offline-friendly."],
  ["Quick Play","Launch straight into a server or a world — from the launcher, or from a desktop shortcut you make in two clicks."],
];
function Features(){
  return (<section id="features" className="relative z-10 px-6 lg:px-[120px] py-16 lg:py-20">
    <div className="max-w-[1200px] mx-auto">
      <div className={`${glass} rounded-2xl px-8 lg:px-12 py-4`}>
        {FEATURES.map(([t,d],i)=>(<div key={t} className={`grid md:grid-cols-[260px_1fr] gap-2 md:gap-10 py-6 ${i>0?"border-t border-white/10":""}`}>
          <h3 className="font-manrope font-bold text-white text-[17px]">{t}</h3>
          <p className="font-inter text-[15px] leading-relaxed text-white/65 max-w-[640px]">{d}</p>
        </div>))}
      </div>
    </div>
  </section>);
}

/* ── Showcase: popular mods (live from Modrinth) ── */
const FALLBACK_MODS=[
  {title:"Sodium",icon:null,color:"#38b6a0",cat:"Performance",desc:"The gold-standard rendering optimization mod. Massive FPS gains on any hardware.",meta:"Fabric · NeoForge",url:"https://modrinth.com/mod/sodium"},
  {title:"Create",icon:null,color:"#c99646",cat:"Tech",desc:"Rotational machines, contraptions and factories with a gorgeous mechanical aesthetic.",meta:"Forge · NeoForge · Fabric",url:"https://modrinth.com/mod/create"},
  {title:"Iris Shaders",icon:null,color:"#7b39fc",cat:"Graphics",desc:"Shader pack support with Sodium compatibility. OptiFine packs work out of the box.",meta:"Fabric · NeoForge",url:"https://modrinth.com/mod/iris"},
  {title:"JEI",icon:null,color:"#b4574e",cat:"Utility",desc:"Just Enough Items — recipe and item lookup, the staple of every modded install.",meta:"Forge · NeoForge · Fabric",url:"https://modrinth.com/mod/jei"},
  {title:"Terralith",icon:null,color:"#5da44e",cat:"Worldgen",desc:"Overhauled overworld generation with nearly 100 new biomes, no new blocks required.",meta:"Datapack · Fabric · NeoForge",url:"https://modrinth.com/datapack/terralith"},
];
const fmtDl=(n)=>n>=1e9?(n/1e9).toFixed(1)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(0)+"k":""+n;
const cap=(s)=>s.charAt(0).toUpperCase()+s.slice(1);
function ModIcon({m,size}){
  const st={width:size,height:size,background:m.icon?"#211744":m.color||"#5316D4"};
  return (<span className={`flex items-center justify-center ${size>50?"rounded-xl":"rounded-lg"} shrink-0 overflow-hidden`} style={st}>{m.icon?(<img src={m.icon} alt="" width={size} height={size} className="w-full h-full object-cover"></img>):(<span className="font-manrope font-bold text-white" style={{fontSize:size>50?20:13}}>{m.title.slice(0,2).toUpperCase()}</span>)}</span>);
}
function Showcase(){
  const [sel,setSel]=useState(0);
  const [mods,setMods]=useState(FALLBACK_MODS);
  const [live,setLive]=useState(false);
  React.useEffect(()=>{
    fetch('https://api.modrinth.com/v2/search?limit=6&index=downloads&facets=[["project_type:mod"]]')
      .then(r=>r.json())
      .then(d=>{
        const hits=(d.hits||[]).map(h=>({title:h.title,icon:h.icon_url,cat:(h.display_categories||h.categories||[]).filter(c=>!["fabric","forge","neoforge","quilt"].includes(c)).slice(0,2).map(cap).join(" · ")||"Mod",desc:h.description,meta:(h.display_categories||h.categories||[]).filter(c=>["fabric","forge","neoforge","quilt"].includes(c)).map(cap).join(" · "),dl:h.downloads,follows:h.follows,url:"https://modrinth.com/mod/"+h.slug}));
        if(hits.length){setMods(hits);setLive(true);}
      }).catch(()=>{});
  },[]);
  const m=mods[Math.min(sel,mods.length-1)];
  return (<section className="relative z-10 px-6 lg:px-[120px] py-16 lg:py-20">
    <div className="max-w-[1200px] mx-auto">
      <div className="max-w-[560px]">
        <h2 className="font-serif2 text-white text-4xl lg:text-[48px] leading-[1.08]">The mod browser, before you install anything</h2>
        <p className="font-inter text-[16px] text-white/60 mt-4">{live?"These are the most-downloaded mods on Modrinth right now — pulled live from the same API the app uses.":"A preview of the built-in browser. The real one covers Modrinth, CurseForge and FTB."}</p>
      </div>
      <div className="grid lg:grid-cols-[1fr_1.2fr] gap-6 mt-10 items-stretch">
        <div className={`${glass} rounded-2xl p-4`}>
          <div className="font-manrope font-bold text-white text-[15px] px-3 pt-2 pb-3">Popular Mods</div>
          <div className="flex flex-col gap-1.5">
            {mods.map((mod,i)=>(<button key={mod.title} onClick={()=>setSel(i)} className={`flex items-center gap-3 rounded-xl px-3 py-2.5 text-left ${i===sel?"bg-[rgba(123,57,252,0.16)] border border-[rgba(138,82,255,0.5)]":"border border-transparent hover:bg-white/5"}`}>
              <ModIcon m={mod} size={40}></ModIcon>
              <span className="flex-1 min-w-0"><span className="block font-manrope font-semibold text-white text-[14px] truncate">{mod.title}</span><span className="block font-inter text-[12px] text-white/45 truncate">{mod.cat}{mod.dl?` · ${fmtDl(mod.dl)} downloads`:""}</span></span>
              <svg className={i===sel?"opacity-100":"opacity-25"} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a484d7" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
            </button>))}
          </div>
        </div>
        <div className={`${glass} rounded-2xl p-8 flex flex-col`}>
          <div className="flex items-center gap-4">
            <ModIcon m={m} size={64}></ModIcon>
            <div className="min-w-0">
              <div className="font-manrope font-bold text-white text-[22px]">{m.title}</div>
              <div className="font-inter text-[13px] text-white/45 mt-0.5">{m.meta||m.cat}</div>
            </div>
          </div>
          <p className="font-inter text-[15px] leading-relaxed text-white/65 mt-5">{m.desc}</p>
          {m.dl&&(<div className="flex gap-6 mt-5">
            <span className="font-inter text-[13px] text-white/50"><b className="text-white font-semibold">{fmtDl(m.dl)}</b> downloads</span>
            {m.follows&&<span className="font-inter text-[13px] text-white/50"><b className="text-white font-semibold">{fmtDl(m.follows)}</b> followers</span>}
          </div>)}
          <div className="flex items-center gap-3 mt-auto pt-8">
            <span className="flex items-center gap-2 font-cabin font-medium text-[15px] text-white bg-primary rounded-[10px] px-6 py-3 opacity-90 cursor-default">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v12"></path><path d="m7 11 5 5 5-5"></path><path d="M5 21h14"></path></svg>Install
            </span>
            <a href={m.url} target="_blank" rel="noopener" className="font-cabin font-medium text-[15px] !text-white/70 hover:!text-white bg-darkp rounded-[10px] px-6 py-3 no-underline">View on Modrinth</a>
          </div>
        </div>
      </div>
    </div>
  </section>);
}

/* ── Compare ── */
const COMPARE_COLS=["Refract","Prism Launcher","CurseForge App","Modrinth App"];
const Y=<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A52FF" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>;
const N=<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.28)" strokeWidth="2.2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>;
const P=(t)=><span className="font-inter text-[13px] text-white/55">{t}</span>;
const COMPARE_ROWS=[
  ["Free & open source",Y,Y,N,Y],
  ["Modrinth content",Y,Y,N,Y],
  ["CurseForge content",Y,P("API key"),Y,N],
  ["FTB modpacks",Y,N,P("Own packs"),N],
  ["Auto Java download",Y,Y,Y,Y],
  ["Mod dependency resolution",Y,P("Partial"),Y,Y],
  ["Import from other launchers",Y,P("MultiMC"),N,P("Partial")],
  ["Modpack updates in place",Y,Y,Y,Y],
  ["Ad-free",Y,Y,N,Y],
  ["Skin manager",Y,N,N,N],
  ["Live server status & ping",Y,N,N,N],
  ["Mod profiles (named sets)",Y,N,N,N],
];
function Compare(){
  return (<section id="compare" className="relative z-10 px-6 lg:px-[120px] py-16 lg:py-20">
    <div className="max-w-[1200px] mx-auto">
      <div className="max-w-[560px]">
        <h2 className="font-serif2 text-white text-4xl lg:text-[48px] leading-[1.08]">Honest comparison</h2>
        <p className="font-inter text-[16px] text-white/60 mt-4">We've used all of these — they're good launchers. This is where they differ, feature by feature.</p>
      </div>
      <div className={`${glass} rounded-2xl mt-10 p-6 lg:p-8 overflow-x-auto`}>
        <table className="w-full min-w-[720px] border-separate" style={{borderSpacing:0}}>
          <thead><tr>
            <th className="text-left pb-4 pr-4"></th>
            {COMPARE_COLS.map((c,i)=>(<th key={c} className={`pb-4 px-4 text-center font-manrope font-bold text-[15px] ${i===0?"text-white":"text-white/60"}`}>
              {i===0?(<span className="inline-flex items-center gap-2"><IrisLogo size={20}></IrisLogo>{c}</span>):c}
            </th>))}
          </tr></thead>
          <tbody>
            {COMPARE_ROWS.map(([label,...cells])=>(<tr key={label}>
              <td className="font-inter text-[15px] text-white/80 py-3.5 pr-4 border-t border-white/10">{label}</td>
              {cells.map((c,i)=>(<td key={i} className={`py-3.5 px-4 text-center border-t border-white/10 ${i===0?"bg-[rgba(123,57,252,0.10)]":""}`}><span className="inline-flex justify-center">{c}</span></td>))}
            </tr>))}
          </tbody>
        </table>
      </div>
      <p className="font-inter text-[13px] text-white/40 mt-5">Based on publicly documented features, July 2026. If we got something wrong about your favorite launcher, <a className="underline" href={GH+"/issues"} target="_blank" rel="noopener">tell us</a> and we'll fix it.</p>
    </div>
  </section>);
}

/* ── Download ── */
const DOWNLOADS=[
  ["Windows","Windows 10 / 11 · .exe","Refract-Windows-x64.exe"],
  ["macOS — Apple Silicon","M1 and newer · .dmg","Refract-macOS-arm64.dmg"],
  ["macOS — Intel","Intel Macs · .dmg","Refract-macOS-x64.dmg"],
  ["Linux — AppImage","Any distro · .AppImage","Refract-Linux-x86_64.AppImage"],
  ["Linux — Debian / Ubuntu",".deb package","Refract-Linux-amd64.deb"],
];
function Download(){
  const [copied,setCopied]=useState(false);
  const cmd="curl -fsSL https://refractmc.net/install.sh | sh";
  const copy=()=>{navigator.clipboard&&navigator.clipboard.writeText(cmd);setCopied(true);setTimeout(()=>setCopied(false),1600);};
  return (<section id="download" className="relative z-10 px-6 lg:px-[120px] py-16 lg:py-20">
    <div className="max-w-[1200px] mx-auto">
      <h2 className="font-serif2 text-white text-4xl lg:text-[48px] leading-[1.08]">Get Refract</h2>
      <div className="grid lg:grid-cols-[1.1fr_1fr] gap-10 mt-10 items-start">
        <div className="flex flex-col gap-3">
          {DOWNLOADS.map(([name,meta,file])=>(<a key={file} href={REL+"/download/"+file} className={`group flex items-center justify-between ${glass} rounded-xl px-6 py-4 hover:border-[rgba(138,82,255,0.6)]`}>
            <span><span className="block font-manrope font-bold text-white text-[16px]">{name}</span><span className="block font-inter text-[13px] text-white/50 mt-0.5">{meta}</span></span>
            <span className="flex items-center justify-center w-10 h-10 rounded-[10px] bg-primary/90 group-hover:bg-primary shrink-0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v12"></path><path d="m7 11 5 5 5-5"></path><path d="M5 21h14"></path></svg>
            </span>
          </a>))}
          <a href={REL} target="_blank" rel="noopener" className="font-inter text-[14px] text-white/60 underline mt-1">All packages &amp; checksums on GitHub Releases →</a>
        </div>
        <div className="flex flex-col gap-5">
          <div className={`${glass} rounded-xl p-6`}>
            <div className="font-manrope font-bold text-white text-[16px]">Linux &amp; macOS one-liner</div>
            <div className="flex items-center gap-3 mt-3 bg-black/50 border border-white/10 rounded-lg px-4 py-3">
              <code className="font-mono text-[13px] text-[#c9b8f5] flex-1 overflow-x-auto whitespace-nowrap">{cmd}</code>
              <button onClick={copy} className="font-cabin font-medium text-[12px] text-white bg-darkp hover:bg-[#3a3059] rounded-md px-3 py-1.5 shrink-0">{copied?"Copied!":"Copy"}</button>
            </div>
          </div>
          <div className="bg-[rgba(123,57,252,0.08)] backdrop-blur-md border border-[rgba(138,82,255,0.35)] rounded-xl p-6">
            <div className="font-manrope font-bold text-white text-[15px]">A note for macOS folks</div>
            <p className="font-inter text-[14px] text-white/65 mt-1.5">Our builds aren't notarized yet (Apple developer accounts cost money — we're getting there). First launch: right-click Refract, choose <b>Open</b>, confirm. Once, and you're done.</p>
          </div>
        </div>
      </div>
    </div>

<div id="cookie-notice" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:100;margin:0 auto;max-width:560px;background:rgba(22,16,39,0.92);backdrop-filter:blur(14px);border:1px solid rgba(164,132,215,0.5);border-radius:14px;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.5);font-family:'Inter',sans-serif;">
<p style="margin:0;color:rgba(244,241,251,0.75);font-size:13.5px;line-height:1.55;">We use a few cookies for anonymous usage analytics — no personal data, no tracking across sites. You can opt out anytime in the app under Settings → Privacy.</p>
<div style="display:flex;gap:10px;margin-top:12px;">
<button id="cookie-accept" style="font-family:'Cabin',sans-serif;font-weight:500;font-size:13px;color:#fff;background:#7b39fc;border:0;border-radius:8px;padding:8px 18px;cursor:pointer;">Okay</button>
<button id="cookie-decline" style="font-family:'Cabin',sans-serif;font-weight:500;font-size:13px;color:rgba(244,241,251,0.7);background:#2b2344;border:0;border-radius:8px;padding:8px 18px;cursor:pointer;">Essential only</button>
</div>
</div>
<script>
(function(){
var KEY='refract-cookie-consent';var el=document.getElementById('cookie-notice');
try{if(localStorage.getItem(KEY)){return;}}catch(e){}
el.style.display='block';
function set(v){try{localStorage.setItem(KEY,v);}catch(e){}el.style.display='none';}
document.getElementById('cookie-accept').addEventListener('click',function(){set('all');});
document.getElementById('cookie-decline').addEventListener('click',function(){set('essential');});
})();
</script>
